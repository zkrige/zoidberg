services:
  zoidberg:
    build:
      context: .
      args:
        # Optional image components, off by default. Enable a feature's build
        # with e.g. ENABLE_WHATSAPP=1 docker compose up -d --build
        ENABLE_WHATSAPP: ${ENABLE_WHATSAPP:-0}
        # Voice-note transcription (whisper.cpp), on by default because both
        # message plugins hand audio to `transcribe`. ENABLE_WHISPER=0 skips
        # the compile and the model download entirely. WHISPER_MODEL is any
        # name whisper.cpp's download-ggml-model.sh takes; bigger is more
        # accurate and slower, and `.en` variants are English-only.
        ENABLE_WHISPER: ${ENABLE_WHISPER:-1}
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
        # WHISPER_NATIVE=1 compiles for the build host's exact CPU, worth ~2x.
        # Safe when you build on the machine you deploy on (the default here);
        # it will fault if that image is then moved to a different CPU.
        WHISPER_NATIVE: ${WHISPER_NATIVE:-0}
    container_name: zoidberg
    restart: unless-stopped
    volumes:
      # Relative sources resolve against this file's directory, so the defaults
      # are "the repo you ran compose in, with its two sibling repos". At
      # /opt/zoidberg that is byte-identical to the /opt literals these
      # replace, and it is the same sibling rule scripts/self-update.sh uses.
      # setup.sh writes the real paths into .env, which compose reads itself.
      - ${REPO_PATH:-.}:/app
      - claude-home:/home/claude/.claude
      - ${SKILLS_PATH:-../claude-skills}:/home/claude/.claude/skills
      - ${SKILLS_PATH:-../claude-skills}:/app/skills
      - ${CONTENT_PATH:-../zoidberg-config}:/app/config
      # Default is the named volume declared below; an absolute value makes it
      # a bind mount instead. The container side is fixed either way, since
      # docker/entrypoint.sh hardcodes it in the chown and in --store-dir.
      - ${WA_STORE_PATH:-wa-bridge-store}:/opt/whatsapp-bridge-store
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/tmp/host-ssh-key:ro
      - ${CONTENT_PATH:-../zoidberg-config}/gcloud-adc.json:/app/config/gcloud-adc.json:ro
      # SOPS binary and this host's age key, so entrypoint.sh can decrypt
      # store/volume-backup/credentials.enc.json into the container. The host
      # keeps only ciphertext plus the key; plaintext lives in the container.
      - /usr/local/bin/sops:/usr/local/bin/sops:ro
      - /etc/zoidberg/age-key.txt:/run/age-key.txt:ro
      - /opt/zoidberg/docker/entrypoint.sh:/entrypoint.sh:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - HOME=/home/claude
      - TERM=xterm-256color
      - CONTENT_DIR=/app/config
      # Personal GCP OAuth credential (zkrige's own account, not a service
      # account) mirrored from the host so tools acting on his behalf (e.g.
      # Crashlytics API) authenticate as him. See config/gcloud-adc.json.
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/gcloud-adc.json
      # Bridge API key is read from the content overlay (config/secrets.json) by
      # docker/entrypoint.sh. Set this var in the host env only to override.
      - WHATSAPP_BRIDGE_API_KEY=${WHATSAPP_BRIDGE_API_KEY:-}
      - SOPS_AGE_KEY_FILE=/run/age-key.txt
    ports:
      - "${WA_BRIDGE_PORT:-8080}:8080"
      - "${WA_WEBHOOK_PORT:-8769}:8769"

volumes:
  claude-home:
  wa-bridge-store:
